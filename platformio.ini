; https://docs.platformio.org/page/projectconf.html

[env:m5stack-cores3]
platform = espressif32@8.0.0
board = m5stack-cores3
framework = arduino
build_flags =
	-Os
	-DARDUINOJSON_STRING_LENGTH_SIZE=4
lib_deps = 
	bblanchon/ArduinoJson@7.4.3
	madhephaestus/ESP32Servo@3.2.1
	m5stack/M5Unified@0.2.29
	arminjo/ServoEasing@3.6.0
	plageoj/UrlEncode@1.0.1
	https://github.com/earlephilhower/ESP8266Audio.git#2.4.2
	https://github.com/TartanLlama/expected.git#v1.3.1
	https://github.com/eyr1n/m5stack-avatar.git#f30c5b6e5833c9cb9e82df4181705b72eb74c533
